name: Generate final Starfall case

on:
  push:
    paths:
      - 'tools/generate_final_case.py'
      - 'tools/mechanical_fit.py'
      - 'tools/make_fit_coupons.py'
      - 'tools/make_full_assembly.py'
      - 'tools/render_assembly.py'
      - 'tools/check_structure.py'
      - '.github/workflows/generate-final-case.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-case:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CAD dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install cadquery==2.6.1 cadquery-ocp==7.8.1.1 trimesh==5.1.0 pillow

      - name: Generate final case files
        run: |
          python tools/generate_final_case.py
          python tools/make_fit_coupons.py
          python tools/check_structure.py
          python tools/make_full_assembly.py
          python tools/render_assembly.py

      - name: Commit generated production files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/Top.STEP production/Bottom.STEP production/Middle_Purple.STEP production/Purple_Inlays.STEP
          git add production/Top.stl production/Bottom.stl production/Middle_Purple.stl production/Purple_Inlays.stl
          git add production/CASE_PRINT_READY_CHECK.json production/STRUCTURAL_COLLISIONS.json
          git add CAD/Starfall_Fully_Assembled.STEP CAD/Starfall_Fully_Assembled_Colored.glb assets/fully_assembled_preview.png
          git add assets/case_iso.png assets/case_top.png assets/case_exploded.png
          git add CAD/Starfall_assembled.STEP CAD/Starfall_case_assembly.STEP CAD/Starfall_render_colored.glb assets/Starfall_render_colored.glb
          git add production/MECHANICAL_VALIDATION.json production/EXPORT_VALIDATION.json production/fit_coupons/
          git add production/Purple_Inlays_Print_Layout.STEP production/Purple_Inlays_Print_Layout.stl
          git add CAD/Starfall_Reactor_Celestial_FINAL_COLORED_CASE.STEP
          git add CAD/Starfall_Reactor_Celestial_FINAL_FULL_COLOR.glb
          git add CAD/Starfall_fit_reference_1p6mm.STEP CAD/Starfall_Mechanical_Assembly.STEP
          if git diff --cached --quiet; then
            echo "Generated files are already current."
          else
            git commit -m "Regenerate mechanically checked Reactor case and fit samples [skip ci]"
            git push
          fi
